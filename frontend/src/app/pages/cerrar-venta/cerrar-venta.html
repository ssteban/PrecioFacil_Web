<main class="sales-page">
  <div class="container">
    <div class="page-header">
      <h1>Cerrar Venta</h1>
      <p>Registra las ventas del día para alimentar el algoritmo y evitar desperdicios.</p>
    </div>

    <div class="form-card">
      <form (ngSubmit)="save()" #salesForm="ngForm">
        
        <div class="form-group">
          <label>Fecha de registro</label>
          <input type="text" class="form-control" [value]="fechaActual" disabled readonly>
        </div>

        <div class="form-group">
          <label for="product">¿Qué producto vendiste?</label>
          <input type="text" id="product" name="product" list="product-list" class="form-control" [ngModel]="productSearch()" (ngModelChange)="productSearch.set($event)" required placeholder="Escribe para buscar un producto...">
          <datalist id="product-list">
            @for (p of dataService.products(); track p.id) {
              <option [value]="p.name"></option>
            }
          </datalist>
        </div>

        <div class="form-group">
          <label for="sold">¿Cuántas unidades lograste vender hoy?</label>
          <input type="number" id="sold" name="sold" class="form-control" [ngModel]="unitsSold()" (ngModelChange)="unitsSold.set($event)" required min="0" placeholder="Ej: 30">
        </div>

        <div class="form-group">
          <label>¿Te sobraron unidades que tuviste que botar o regalar?</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="hadLeftovers" [value]="true" [ngModel]="hadLeftovers()" (ngModelChange)="hadLeftovers.set($event)"> Sí
            </label>
            <label class="radio-option">
              <input type="radio" name="hadLeftovers" [value]="false" [ngModel]="hadLeftovers()" (ngModelChange)="hadLeftovers.set($event)"> No, vendí todo
            </label>
          </div>
        </div>

        @if (hadLeftovers()) {
          <div class="form-group slide-down">
            <label for="leftovers">¿Cuántas te sobraron?</label>
            <input type="number" id="leftovers" name="leftovers" class="form-control" [ngModel]="leftoversCount()" (ngModelChange)="leftoversCount.set($event)" min="1" placeholder="Ej: 5">
          </div>
        }

        <button type="submit" class="btn btn-secondary btn-block" [disabled]="!salesForm.form.valid">Guardar Cierre de Día</button>
      </form>
    </div>
  </div>
</main>

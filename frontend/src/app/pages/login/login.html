<app-header></app-header>
<main class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Bienvenido de Vuelta</h2>
        <p>Ingresa a tu cuenta para seguir optimizando tus precios.</p>
      </div>

      <form class="auth-form" (submit)="onSubmit($event)">
        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input type="email" id="correo" name="correo" class="form-control" required placeholder="Ej: micorreo@email.com">
        </div>

        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" class="form-control" required placeholder="********">
        </div>

        @if (loginError()) {
          <div class="alert alert-error">
            {{ loginError() }}
          </div>
        }

        <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading()">
          @if (isLoading()) {
            <span>Iniciando sesión...</span>
          } @else {
            <span>Iniciar Sesión</span>
          }
        </button>
      </form>

      <div class="auth-footer">
        <p>¿No tienes una cuenta? <a routerLink="/registro" class="auth-link">Regístrate Gratis</a></p>
      </div>
    </div>
  </div>
</main>
<app-footer></app-footer>

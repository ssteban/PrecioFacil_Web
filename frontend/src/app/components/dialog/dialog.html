@if (dialogService.isOpen()) {
  <div class="dialog-overlay" (click)="onOverlayClick($event)">
    <div class="dialog-content" (click)="$event.stopPropagation()">
      
      <div class="dialog-icon" [ngClass]="dialogService.options().type">
        @switch (dialogService.options().type) {
          @case ('success') {
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          }
          @case ('warning') {
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          }
          @case ('error') {
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
          }
          @default {
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          }
        }
      </div>

      <h2 class="dialog-title">{{ dialogService.options().title }}</h2>
      <p class="dialog-message">{{ dialogService.options().message }}</p>

      <div class="dialog-actions">
        @if (dialogService.options().mode === 'confirm') {
          <button class="btn btn-outline" (click)="onCancel()">
            {{ dialogService.options().cancelText }}
          </button>
          <button class="btn" 
                  [ngClass]="dialogService.options().type === 'error' || dialogService.options().type === 'warning' ? 'btn-accent' : 'btn-primary'"
                  (click)="onConfirm()">
            {{ dialogService.options().confirmText }}
          </button>
        } @else {
          <button class="btn btn-primary btn-block" (click)="onConfirm()">
            {{ dialogService.options().confirmText }}
          </button>
        }
      </div>
    </div>
  </div>
}

<!-- Floating Hamburger Button -->
<button 
  class="floating-hamburger-btn" 
  (click)="toggleMenu($event)" 
  [class.hidden]="uiService.isSidebarOpen()"
  aria-label="Abrir menú">
  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
</button>

<!-- Sidebar Overlay (Only on mobile or when not pinned) -->
@if (uiService.isSidebarOpen() && !uiService.isSidebarPinned()) {
  <div class="sidebar-overlay" (click)="closeMenu()"></div>
}

<!-- Sidebar Navigation -->
<aside class="sidebar" [class.open]="uiService.isSidebarOpen()" [class.pinned]="uiService.isSidebarPinned()">
  <div class="sidebar-header">
    <div class="logo">
      <a routerLink="/dashboard" (click)="closeOnNavigate()">
        <span class="logo-text">Precio<span class="highlight">Fácil</span></span>
      </a>
    </div>
    
    <div class="header-actions">
      <button class="pin-btn" (click)="togglePin()" [class.is-pinned]="uiService.isSidebarPinned()" [title]="uiService.isSidebarPinned() ? 'Desfijar menú' : 'Fijar menú'">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="17" x2="12" y2="22"></line>
          <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path>
        </svg>
      </button>
      <button class="close-btn d-md-none" (click)="closeMenu()" aria-label="Cerrar menú">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>
  
  <nav class="sidebar-nav">
    <ul>
      <li>
        <a routerLink="/dashboard" routerLinkActive="active" (click)="closeOnNavigate()">
          <span class="icon">📊</span>
          <span class="text">Panel</span>
        </a>
      </li>
      <li class="submenu-container" [class.open]="openMenu() === 'inventario'">
        <a href="#" (click)="toggleSubmenu('inventario', $event)" class="submenu-header">
          <span class="icon">📦</span>
          <span class="text">Inventario</span>
          <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </a>
        <ul class="submenu">
          <li>
            <a routerLink="/catalogo" routerLinkActive="active" (click)="closeOnNavigate()">
              <span class="text">Mis Productos</span>
            </a>
          </li>
          <li>
            <a routerLink="/produccion" routerLinkActive="active" (click)="closeOnNavigate()">
              <span class="text">Producción del Día</span>
            </a>
          </li>
        </ul>
      </li>
      <li class="submenu-container" [class.open]="openMenu() === 'ventas'">
        <a href="#" (click)="toggleSubmenu('ventas', $event)" class="submenu-header">
          <span class="icon">📈</span>
          <span class="text">Gestión de Ventas</span>
          <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </a>
        <ul class="submenu">
          <li>
            <a routerLink="/cerrar-venta" routerLinkActive="active" (click)="closeOnNavigate()">
              <span class="text">Cerrar Venta</span>
            </a>
          </li>
          <li>
            <a routerLink="/ventas" routerLinkActive="active" (click)="closeOnNavigate()">
              <span class="text">Histórico de Ventas</span>
            </a>
          </li>
        </ul>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    @if (auth.user(); as user) {
      <div class="user-info">
        <span class="user-name">{{ user.username }}</span>
        <span class="user-email">{{ user.correo }}</span>
      </div>
    }
    <button class="btn btn-outline btn-block" (click)="logout()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; vertical-align: middle;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      <span style="vertical-align: middle;">Salir</span>
    </button>
  </div>
</aside>

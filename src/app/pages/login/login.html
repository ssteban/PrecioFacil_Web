<app-header></app-header>
<main class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Bienvenido de Vuelta</h2>
        <p>Ingresa a tu cuenta para seguir optimizando tus precios.</p>
      </div>

      <form class="auth-form" (submit)="onSubmit($event)">
        <div class="form-group">
          <label for="username">Nombre de Usuario o Correo</label>
          <input type="text" id="username" name="username" class="form-control" required placeholder="Ej: micorreo@email.com">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control" required placeholder="********">
        </div>

        @if (loginError()) {
          <div class="alert alert-error">
            {{ loginError() }}
          </div>
        }

        <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
      </form>

      <div class="auth-footer">
        <p>¿No tienes una cuenta? <a routerLink="/registro" class="auth-link">Regístrate Gratis</a></p>
      </div>
    </div>
  </div>
</main>
<app-footer></app-footer>
